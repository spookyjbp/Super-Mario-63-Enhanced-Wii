name: Wii build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify original sprite conversion
        run: |
          python -m pip install Pillow==11.3.0 "numpy>=2,<3" "lz4>=4,<5" "scipy>=1.13,<2"
          python tools/build_mario_atlas.py --check
          python tests/test_atlas.py
          python tests/test_player_art.py
          python tests/test_course.py
          python tests/test_object_art.py
          python tests/test_art_repair.py
          python tests/test_water.py
          python tests/test_picture_signs.py
          python tests/test_cinema.py
          python tools/build_level.py --check
          python tests/test_level.py
      - name: Test platform-independent physics
        run: make -C tests test

  build:
    needs: physics-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc@sha256:d50f8a886f2ce1d3c22685a774afb0845379876b47d9b41a9b729f4f63a54813
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package for Homebrew Channel
        run: make -j2 package
      - name: Verify outputs
        run: |
          test -s boot.dol
          test -s dist/apps/super-mario-63-enhanced-wii/boot.dol
          test -s dist/apps/super-mario-63-enhanced-wii/meta.xml
          test -s dist/apps/super-mario-63-enhanced-wii/data/front_end.bin
          test -s dist/apps/super-mario-63-enhanced-wii/data/course_8e1_art.bin
          test -s dist/apps/super-mario-63-enhanced-wii/data/cinema_intro.bin
          test -s dist/apps/super-mario-63-enhanced-wii/data/cinema_intro2.bin
          /opt/devkitpro/devkitPPC/bin/powerpc-eabi-readelf -h boot.elf
      - name: MEM1 budget
        run: |
          # code, data and bss must leave room in MEM1 (24 MiB from 0x80000000)
          # for the heap, the two framebuffers and the GX FIFO
          /opt/devkitpro/devkitPPC/bin/powerpc-eabi-size -A boot.elf | grep -E "^\.(text|data|rodata|bss|sbss|sdata)" || true
          # the end of .bss (its address + size) is the program's end in MEM1
          end=$(/opt/devkitpro/devkitPPC/bin/powerpc-eabi-size -A -d boot.elf | awk '$1==".bss"{printf "%.0f\n", $2 + $3}')
          used=$(( end - 0x80000000 ))
          echo "MEM1 used by the program: $used bytes ($(( used / 1048576 )) MiB of 24)"
          test "$used" -lt $(( 22 * 1048576 + 512 * 1024 ))
      - name: Upload Homebrew Channel application
        uses: actions/upload-artifact@v4
        with:
          name: super-mario-63-enhanced-wii
          path: dist/apps/
          if-no-files-found: error
